name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint is a compatibility alias for typecheck; keep one CI check.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # vite build + esbuild server bundle -> api/[...path].js (gitignored,
      # regenerated on every build; Vercel runs the same script)
      - name: Build
        run: pnpm run build
